name: 사이트 배포 + 금리 갱신

on:
  push:
    branches: [main]        # 파일을 올리면 바로 사이트에 반영
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 오전 6시 17분 금리 갱신
  workflow_dispatch:         # Actions 화면에서 직접 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 금리 받아오기
        continue-on-error: true   # 금감원 서버가 잠깐 안 돼도 사이트 배포는 계속
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
        run: node scripts/fetch-rates.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
