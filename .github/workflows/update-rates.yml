name: 예적금 금리 매일 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 오전 6시 17분
  workflow_dispatch:         # Actions 화면에서 직접 실행할 수도 있어요

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 금리 받아오기
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
        run: node scripts/fetch-rates.mjs
      - name: 바뀐 내용 저장
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add site/data/rates.json
          git diff --cached --quiet || git commit -m "금리 갱신 $(date -u +%F)"
          git push
